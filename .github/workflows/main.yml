name: Compilar CinePro Camera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK Debug Listo para Instalar
        run: |
          sed -i 's/package="com.cinepro.camera"//g' app/src/main/AndroidManifest.xml || true
          gradle assembleDebug

      - name: Subir APK para Descarga Directa
        uses: actions/upload-artifact@v4
        with:
          name: CinePro-Camera-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
